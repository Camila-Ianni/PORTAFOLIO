<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <!-- Cute Pastel Keyboard Illustration inspired by Slide 1 -->
  <defs>
    <filter id="kb-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1d4d6e" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Chasis / base del teclado -->
  <rect x="10" y="16" width="220" height="110" rx="18" fill="#ffffff" stroke="#9cd4f4" stroke-width="4.5" filter="url(#kb-shadow)" />
  <rect x="16" y="22" width="208" height="98" rx="14" fill="#edf8fd" stroke="#bde0fe" stroke-width="2"/>

  <!-- Fila 1 de teclas -->
  <g fill="#ffffff" stroke="#9cd4f4" stroke-width="2.5" rx="4">
    <rect x="24" y="28" width="16" height="15" rx="4" />
    <rect x="44" y="28" width="16" height="15" rx="4" />
    <rect x="64" y="28" width="16" height="15" rx="4" />
    <rect x="84" y="28" width="16" height="15" rx="4" />
    <rect x="104" y="28" width="16" height="15" rx="4" />
    <rect x="124" y="28" width="16" height="15" rx="4" />
    <rect x="144" y="28" width="16" height="15" rx="4" fill="#fff4bd" stroke="#fed976" />
    <rect x="164" y="28" width="16" height="15" rx="4" />
    <rect x="184" y="28" width="30" height="15" rx="4" fill="#fde2e8" stroke="#f8b4c4" />
  </g>

  <!-- Fila 2 de teclas -->
  <g fill="#ffffff" stroke="#9cd4f4" stroke-width="2.5" rx="4">
    <rect x="24" y="48" width="22" height="15" rx="4" />
    <rect x="50" y="48" width="16" height="15" rx="4" />
    <rect x="70" y="48" width="16" height="15" rx="4" />
    <rect x="90" y="48" width="16" height="15" rx="4" fill="#fff4bd" stroke="#fed976" />
    <rect x="110" y="48" width="16" height="15" rx="4" />
    <rect x="130" y="48" width="16" height="15" rx="4" />
    <rect x="150" y="48" width="16" height="15" rx="4" />
    <rect x="170" y="48" width="16" height="15" rx="4" />
    <rect x="190" y="48" width="24" height="15" rx="4" />
  </g>

  <!-- Fila 3 de teclas -->
  <g fill="#ffffff" stroke="#9cd4f4" stroke-width="2.5" rx="4">
    <rect x="24" y="68" width="26" height="15" rx="4" />
    <rect x="54" y="68" width="16" height="15" rx="4" />
    <rect x="74" y="68" width="16" height="15" rx="4" />
    <rect x="94" y="68" width="16" height="15" rx="4" />
    <rect x="114" y="68" width="16" height="15" rx="4" fill="#fff4bd" stroke="#fed976" />
    <rect x="134" y="68" width="16" height="15" rx="4" />
    <rect x="154" y="68" width="16" height="15" rx="4" />
    <rect x="174" y="68" width="40" height="15" rx="4" fill="#bde0fe" stroke="#9cd4f4" />
  </g>

  <!-- Fila 4: Espacio y teclas de comando -->
  <g fill="#ffffff" stroke="#9cd4f4" stroke-width="2.5" rx="4">
    <rect x="24" y="88" width="22" height="16" rx="4" fill="#fde2e8" stroke="#f8b4c4" />
    <rect x="50" y="88" width="20" height="16" rx="4" />
    <rect x="74" y="88" width="20" height="16" rx="4" />
    <!-- Barra espaciadora -->
    <rect x="98" y="88" width="70" height="16" rx="5" fill="#fff4bd" stroke="#fed976" stroke-width="3" />
    <rect x="172" y="88" width="20" height="16" rx="4" />
    <rect x="196" y="88" width="18" height="16" rx="4" fill="#bde0fe" stroke="#9cd4f4" />
  </g>

  <!-- Acento decorativo -->
  <circle cx="215" cy="18" r="4" fill="#fed976"/>
</svg>
